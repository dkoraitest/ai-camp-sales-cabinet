  const detailed = coach ? new Set((coach.managers||[]).filter(x => x.summary).map(x => x.id)) : new Set();
  let html = '';

  // Большой отдел: сначала рейтинг таблицей, иначе двадцать карточек нечитаемы
  if(all.length > 8){
    const rows = all.map(m => { const s = mgrStats(m); return {m, n: s.mine.length, avg: s.avg} })
      .sort((a,b) => (b.avg ?? -1) - (a.avg ?? -1));
    html += '<h2>Рейтинг команды · '+all.length+' человек</h2><table><thead><tr>'+
      '<th>#</th><th>Менеджер</th><th>Контактов</th><th>Балл</th><th></th><th></th></tr></thead><tbody>';
    rows.forEach((r,i) => {
      html += '<tr><td class="muted">'+(i+1)+'</td><td>'+esc(r.m.name)+'</td>'+
        '<td class="muted">'+r.n+'</td>'+
        '<td>'+(r.avg!==null ? '<span class="pill '+grade(r.avg,10)+'">'+r.avg.toFixed(1)+'</span>' : '<span class="pill">—</span>')+'</td>'+
        '<td style="width:180px">'+(r.avg!==null ? '<div class="bar '+grade(r.avg,10)+'"><i style="width:'+Math.round(r.avg*10)+'%"></i></div>' : '')+'</td>'+
        '<td class="muted small">'+(detailed.has(r.m.id) ? 'разбор есть' : '')+'</td></tr>';
    });
    html += '</tbody></table>';
  }

  const shown = all.length > 8 && detailed.size ? all.filter(m => detailed.has(m.id)) : all;
  html += '<div class="rail-head"><h2>'+(all.length > 8 ? 'Разбор · '+shown.length+' из '+all.length : 'Команда')+'</h2>'+
    '<span id="rail-nav" style="display:none;align-items:center;gap:8px">'+
      '<button class="arrow" onclick="railScroll(-1)" title="Левее">&#8249;</button>'+
      '<button class="arrow" onclick="railScroll(1)" title="Правее">&#8250;</button>'+
      '<span class="muted small">листается вбок</span></span></div>';

  html += '<div class="rail" id="mgr-rail">';
  shown.forEach(m => {
    const {mine, avg} = mgrStats(m);
    const fb = coach ? (coach.managers||[]).find(x => x.id === m.id) : null;
    const weak = fb && (fb.skills||[]).length
      ? fb.skills.slice().sort((a,b) => a.value/(a.max||10) - b.value/(b.max||10))[0] : null;

    html += '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">'+
      '<strong>'+esc(m.name)+'</strong>'+
      (avg!==null ? '<span class="pill '+grade(avg,10)+'">'+avg.toFixed(1)+'</span>' : '<span class="pill">—</span>')+'</div>'+
      '<div class="muted small" style="margin-top:2px">'+esc(m.role)+
        (tgLinked(m.id) ? ' · <span class="pill good">Telegram</span>' : '')+'</div>'+
      '<div class="kpi-note">'+mine.length+' контактов · '+
        mine.filter(c=>c.kind==='call').length+' звонков, '+mine.filter(c=>c.kind==='chat').length+' переписок</div>';

    if(fb && (fb.skills||[]).length){
      html += '<div style="margin-top:14px"><div class="kpi-label">Карта навыков</div>';
      fb.skills.forEach(s => {
        html += '<div class="skill"><div class="lbl"><span>'+esc(s.name)+'</span>'+
          '<span class="muted">'+s.value+'/'+(s.max||10)+'</span></div>'+
          '<div class="bar '+grade(s.value,s.max||10)+'"><i style="width:'+Math.round(s.value/(s.max||10)*100)+'%"></i></div></div>';
      });
      html += '</div>';
    }
    if(weak) html += '<div class="weak"><div class="lbl">Слабое место</div>'+
      '<div class="val"><b>'+esc(weak.name)+'</b>'+
      '<span class="pill '+grade(weak.value,weak.max||10)+'">'+weak.value+'</span></div></div>';
    if(fb && fb.focus) html += '<p class="focus"><b>Фокус недели.</b> '+esc(shorten(fb.focus, 150))+'</p>';

    if(fb) html += '<div class="card-cta"><button class="act" onclick="openCoach(\''+m.id+'\')">'+
      (tgLinked(m.id) ? '' : '')+
      'Разбор и сообщения'+((fb.telegram_messages||[]).length ? ' · '+(fb.telegram_messages||[]).length : '')+' &rarr;</button></div>';
    html += '</div>';
  });
  html += '</div>';

  setTimeout(railNav, 0);
  if(!coach) html += '<h2>Карта навыков и обратная связь</h2>'+
    emptyBlock('Тренер ещё не подключён',
      'Кабинет оценивает разговоры, но пока не объясняет менеджеру, что делать иначе, и не тренирует слабые места.','шага 2');
  return html;
}
const shorten = (s, n) => s.length > n ? s.slice(0, n).replace(/[\s,;:—-]+\S*$/, '')+'…' : s;
function railScroll(dir){
  const r = $('#mgr-rail'); if(r) r.scrollBy({left: dir * 334, behavior: 'smooth'});
}
/* Стрелки нужны, только если лента не влезла: иначе кнопка, которая ничего
   не делает, выглядит как сломанная. */
function railNav(){
  const r = $('#mgr-rail'), nav = $('#rail-nav');
  if(r && nav) nav.style.display = r.scrollWidth > r.clientWidth + 4 ? 'inline-flex' : 'none';
}
window.addEventListener('resize', railNav);
function openCoach(id){
  const coach = DataSource.coaching(); if(!coach) return;
  const fb = (coach.managers||[]).find(x => x.id === id); if(!fb) return;
  const m = DataSource.managers().find(x => x.id === id) || {};
  const {mine, avg} = mgrStats(m);
  $('#m-title').textContent = m.name || id;
  $('#m-sub').textContent = (m.role||'')+' · '+mine.length+' контактов'+
    (avg!==null ? ' · средний балл '+avg.toFixed(1) : '')+(fb.telegram ? ' · '+fb.telegram : '');
  $('#m-body').innerHTML = coachBody(id);
  $('#modal').showModal();
}
registerTab({ id: 'managers', label: 'Команда', render: renderManagers });

</script>
<script>
/* Блок «Лиды». Подключается сборщиком: scripts/build_cabinet.py */
/* ---------------------------- ЛИДЫ ---------------------------- */
function renderLeads(){
  const enr = DataSource.enrichment();
  /* Сверху — сделки, где недавно разговаривали: с них начинается работа. */
  const act = {}; DataSource.contacts().forEach(c => act[c.lead_id] = c.when);
  const leads = DataSource.leads().slice().sort((a,b) =>
    (act[b.id] ? new Date(act[b.id]) : 0) - (act[a.id] ? new Date(act[a.id]) : 0));
  const isB2C = CFG.profile === 'b2c';
  let html = '<table><thead><tr>'+
    '<th>'+(isB2C?'Родитель':'Компания')+'</th><th>'+(isB2C?'Возраст':'Контакт')+'</th>'+
    '<th>Источник</th><th>Коммуникации</th><th>Этап</th><th>Сумма</th>'+
    '<th>'+(isB2C?'Реакция, мин':'След. шаг')+'</th><th></th></tr></thead><tbody>';
  leads.forEach(l => {
    const e = enr ? (enr.leads||[]).find(x => x.id === l.id) : null;
    html += '<tr class="clickable" onclick="openLead(\''+l.id+'\')">'+
      '<td>'+esc(l.company || l.parent)+'</td>'+
      '<td>'+esc(isB2C ? l.child_age+' лет' : (l.contact||''))+'</td>'+
      '<td class="muted">'+esc(l.source)+'</td>'+
      '<td>'+dealStrip(l.id)+'</td>'+
      '<td><span class="pill">'+esc(stageLabel(l.stage))+'</span></td>'+
      '<td>'+money(l.value_kzt)+'</td>'+
      '<td class="muted">'+(isB2C ? (l.responded_in_min ?? '—')
        : closed(l.stage) ? '—' : (l.next_step || '<span class="pill bad">нет</span>'))+'</td>'+
      '<td>'+(e ? '<span class="pill good">обогащён</span>' : '')+'</td></tr>';
  });
  html += '</tbody></table>';
  if(!enr) html += '<h2>Обогащение</h2>'+emptyBlock('Карточки пока сырые',
    'Кабинет знает только то, что записал менеджер. Внешнего контекста о клиенте нет.','шага 3');
  return html;
}
function openLead(id){
  const l = DataSource.leads().find(x => x.id === id);
  if(!l) return;
  const enr = DataSource.enrichment();
  const e = enr ? (enr.leads||[]).find(x => x.id === id) : null;
  $('#m-title').textContent = l.company || l.parent;
  $('#m-sub').textContent = stageLabel(l.stage)+' · '+money(l.value_kzt)+' · источник: '+l.source;
  let body = '<div class="card" style="margin-bottom:16px">';
  Object.entries(l).forEach(([k,v]) => { if(k!=='id')
    body += '<div class="crit"><span class="muted">'+esc(k)+'</span><span>'+esc(v ?? '—')+'</span></div>'; });
  body += '</div>';
  if(e){
    if(e.context) body += '<h2 style="margin-top:0">Контекст</h2><div class="card">'+esc(e.context)+'</div>';
    if(e.message) body += '<h2>Сообщение</h2><div class="card" style="white-space:pre-wrap">'+esc(e.message)+'</div>';
  }
  /* Путь сделки: коммуникации, склеенные по этапам. Разговор открывается кликом. */
  body += '<h2>Путь сделки</h2>'+dealThread(id);
  $('#m-body').innerHTML = body;
  $('#modal').showModal();
}
/* У закрытой сделки следующего шага не бывает — красное «нет» здесь врёт. */
const closed = st => { const f = DataSource.funnel().map(x => x.id || x);
  return f.length > 2 && f.slice(-2).indexOf(st) >= 0 };
registerTab({ id: 'leads', label: 'Лиды', render: renderLeads });

</script>
<script>
/* Блок «Глубокая аналитика». Подключается сборщиком: scripts/build_cabinet.py */
/* ----------------------- ГЛУБОКАЯ АНАЛИТИКА ----------------------- */
/* Каждый разрез устроен одинаково: сначала что смотрели и на каком объёме,
   потом вывод. Иначе получается полотно текста, которому нечем себя
   подтвердить. Цифры считает код, вывод пишет модель.                    */
function scopeLine(t){ return '<p class="scope">'+t+'</p>' }
function finding(level, title, text){
  return '<div class="insight '+esc(level||'warn')+'"><h4>'+esc(title)+'</h4><p>'+esc(text)+'</p></div>';
}
function wonVsLost(){
  const a = (DataSource.scores()||{}).aggregates;
  const w = a && a.won_vs_lost;
  if(!w || !(w.rows||[]).length) return '';
  /* Колонка выигранных всегда зелёная, проигранных — красная: это сравнение
     двух исходов, а не оценка каждой строки по отдельности. */
  const cell = (v, kind, other, cls) => {
    const max = kind === 'share' ? 1 : Math.max(v, other, 0.1);
    return '<div class="v"><div class="bar '+cls+'"><i style="width:'+
      Math.round(v/max*100)+'%"></i></div><span>'+
      (kind === 'share' ? Math.round(v*100)+'%' : v)+'</span></div>';
  };
  return '<h2>О чём говорят в выигранных сделках</h2>'+
    scopeLine('Сравнили поведение менеджера в '+w.won_deals+' закрытых сделках ('+w.won_contacts+
      ' коммуникаций) и в '+w.lost_deals+' проигранных ('+w.lost_contacts+
      '). Сравниваются приёмы, а не свойства клиента: свойства повторить нельзя, приёмы можно.')+
    '<div class="card"><div class="cmp cmp-head"><div>Что делали в разговоре</div>'+
      '<div>'+esc(w.won_label)+'</div><div>'+esc(w.lost_label)+'</div></div>'+
    w.rows.map(r => '<div class="cmp"><div>'+esc(r.label)+'</div>'+
      cell(r.won, r.kind, r.lost, 'good') + cell(r.lost, r.kind, r.won, 'bad')+'</div>').join('')+
    '</div>';
}
function bantDepth(){
  const q = bantByStage(); if(!q) return '';
  const late = q.stages.filter(r => r.leads && r.full < r.leads);
  const money = late.reduce((a,r) => a + (r.money - r.money_full), 0);
  return scopeLine('По всем '+q.deals+' сделкам в работе собрали, что выяснено за всю историю '+
    'переписки и звонков, а не в одном разговоре. Неквалифицированных сделок в воронке на '+
    (money ? new Intl.NumberFormat('ru-RU').format(money)+' ₸' : 'значимую сумму')+'.');
}
function renderDeep(){
  const d = DataSource.deep();
  const have = DataSource.contacts().length;
  const deals = new Set(DataSource.contacts().map(c => c.lead_id)).size;
  const need = (CFG.deep_analytics||{}).min_items || 300;

  let html = '<div class="card" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">'+
    '<div><div class="kpi-label">Что проанализировано</div>'+
    '<div class="small muted">'+have+' коммуникаций в '+deals+' сделках · четыре разреза: выигранные против проигранных, квалификация по воронке, карта возражений, модель клиента по сегментам</div></div>'+
    '<div style="text-align:right"><div class="kpi">'+have+' <span class="muted" style="font-size:15px">/ '+need+'</span></div>'+
    '<div class="kpi-note">порог значимости</div></div></div>';
  if(have < need) html += '<p class="muted small" style="margin:14px 0 0">'+
    'На таком объёме выводы — иллюстрация механики, а не статистика. Чтобы закономерности стали значимыми, нужно от '+need+' контактов: это примерно месяц работы отдела из четырёх человек.</p>';
  html += '</div>';

  if(!d) return html + emptyBlock('Глубокая аналитика не запускалась',
    'Это отдельный разрез: не «как прошёл разговор», а «что общего у сделок, которые мы выиграли».','шага 4');

  html += wonVsLost();
  if((d.win_patterns||[]).length){
    html += '<h2>Выводы по выигранным сделкам</h2>';
    html += scopeLine('Что из этих различий можно повторить завтра.');
    d.win_patterns.forEach(p => html += finding('good', p.title, p.text));
  }

  if((d.qualification_link||[]).length || bantByStage()){
    html += '<h2>Квалификация и исход</h2>' + bantDepth();
    html += bantChart().replace(/^<h2>.*?<\/h2>/, '').replace(/<p class="scope">.*?<\/p>/, '');
    (d.qualification_link||[]).forEach(p => html += finding(p.level, p.title, p.text));
  }

  if((d.objection_map||[]).length){
    html += '<h2>Карта возражений</h2>'+
      scopeLine('Дословные формулировки из всей базы, частота и ответ тех, у кого выше конверсия. Прямой вход в скрипты и в обучение.')+
      '<table><thead><tr><th>Возражение</th><th>Частота</th><th>Что отвечают лучшие</th></tr></thead><tbody>';
    d.objection_map.forEach(o => html += '<tr><td>«'+esc(o.objection)+'»</td><td>'+esc(o.count)+'</td>'+
      '<td class="muted">'+esc(o.best_response)+'</td></tr>');
    html += '</tbody></table>';
  }

  if((d.spsv||[]).length){
    html += '<h2>Модель клиента по сегментам</h2>'+
      scopeLine('Собрано из блоков разговоров: как клиенты каждого сегмента описывают свою ситуацию, боль и ценность их же словами. Материал для скриптов, КП и сайта — не придуманный на стратсессии.')+
      '<div class="cards">';
    d.spsv.forEach(s => {
      html += '<div class="card"><div style="display:flex;justify-content:space-between"><strong>'+esc(s.segment)+'</strong>'+
        '<span class="pill">'+esc(s.share)+'</span></div>';
      [['Ситуация',s.situation],['Проблема',s.problem],['Решение',s.solution],['Ценность',s.value]].forEach(([k,v]) => {
        if(v) html += '<div style="margin-top:10px"><div class="kpi-label">'+k+'</div><div class="small">'+esc(v)+'</div></div>';
      });
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}
registerTab({ id: 'deep', label: 'Глубокая аналитика', render: renderDeep });

</script>
<script>boot();</script>
</body>
