<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет продаж</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151d; --panel-2:#171b25; --line:#222838;
    --fg:#f2f4f8; --muted:#8b93a7; --accent:#5b8cff; --good:#34d399;
    --warn:#fbbf24; --bad:#f87171; --radius:14px;
    --turn-mgr:rgba(91,140,255,.10);
  }
  :root[data-theme="light"]{
    --bg:#f6f7fa; --panel:#ffffff; --panel-2:#eef1f6; --line:#dfe3ec;
    --fg:#141821; --muted:#5d6577; --accent:#2f6bff; --good:#0f9d63;
    --warn:#b7791f; --bad:#d64545;
    --turn-mgr:rgba(47,107,255,.09);
  }
  :root[data-theme="light"] .card,
  :root[data-theme="light"] dialog{box-shadow:0 1px 3px rgba(20,24,33,.06)}
  #theme{background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:6px 12px;font-size:13px;cursor:pointer}
  #theme:hover{color:var(--fg);border-color:var(--muted)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{padding:22px 28px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
  nav button{background:none;border:0;color:var(--muted);padding:14px 16px;
    font-size:14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
  main{padding:24px 28px;max-width:1320px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .kpi{font-size:30px;font-weight:600;letter-spacing:-.02em}
  .kpi-label{color:var(--muted);font-size:13px;margin-bottom:6px}
  .kpi-note{color:var(--muted);font-size:12px;margin-top:6px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:30px 0 12px;font-weight:600}
  h2:first-child{margin-top:0}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;
    text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--panel-2)}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
  .pill.good{color:var(--good);border-color:rgba(52,211,153,.3)}
  .pill.warn{color:var(--warn);border-color:rgba(251,191,36,.3)}
  .pill.bad{color:var(--bad);border-color:rgba(248,113,113,.3)}
  .pill.accent{color:var(--accent);border-color:rgba(91,140,255,.35)}
  .bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent)}
  .bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);
    padding:34px;text-align:center;color:var(--muted)}
  .empty b{color:var(--fg);display:block;margin-bottom:6px;font-size:16px}
  .empty code{background:var(--panel-2);padding:2px 7px;border-radius:6px;color:var(--accent)}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:var(--radius);max-width:780px;width:92%;padding:0}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg-head{padding:20px 24px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .dlg-body{padding:20px 24px;max-height:64vh;overflow:auto}
  .turn{margin-bottom:12px;display:flex;gap:10px}
  .turn .who{flex:0 0 76px;color:var(--muted);font-size:12px;padding-top:2px}
  .turn.client .text{background:var(--panel-2);border-radius:10px;padding:9px 12px}
  .turn.manager .text{background:var(--turn-mgr);border-radius:10px;padding:9px 12px}
  .x{background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  select,input,button.act{background:var(--panel-2);border:1px solid var(--line);color:var(--fg);
    padding:8px 11px;border-radius:9px;font-size:14px}
  button.act{cursor:pointer;border-color:rgba(91,140,255,.35);color:var(--accent)}
  button.act:disabled{cursor:not-allowed;color:var(--muted);border-color:var(--line)}
  .crit{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:14px}
  .crit:last-child{border:0}
  .muted{color:var(--muted)}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--panel-2);padding:1px 6px;border-radius:5px}
  .small{font-size:13px}
  .insight{border-left:3px solid var(--accent);padding:12px 16px;background:var(--panel);
    border-radius:0 10px 10px 0;margin-bottom:10px}
  .insight.warn{border-left-color:var(--warn)}
  .insight.bad{border-left-color:var(--bad)}
  .insight.good{border-left-color:var(--good)}
  .insight h4{margin:0 0 4px;font-size:14px}
  .insight p{margin:0;color:var(--muted);font-size:13px}
  .funnel{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .fstep{flex:1 0 150px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:12px}
  .fstep.focus{border-color:rgba(91,140,255,.5);background:rgba(91,140,255,.07)}
  .fstep b{font-size:13px} .fstep p{margin:6px 0 0;font-size:12px;color:var(--muted)}
  .skill{margin-bottom:10px}
  .skill .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .tg{background:var(--panel-2);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;
    border-left:2px solid var(--accent);white-space:pre-wrap}
  .tg .meta{color:var(--muted);font-size:12px;margin-bottom:6px;white-space:normal}
  /* BANT по воронке и сравнение выигранных с проигранными */
  .stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--panel-2)}
  .stack i{display:block;height:100%}
  .stack i.full{background:var(--good)} .stack i.part{background:var(--warn)}
  .stack i.none{background:rgba(248,113,113,.35)}
  .qrow{display:grid;grid-template-columns:190px 1fr 132px;gap:12px;align-items:center;
    padding:7px 0;font-size:13px}
  .qrow .lbl{color:var(--fg)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:2px 0 12px}
  .legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
  .cmp{display:grid;grid-template-columns:1fr 150px 150px;gap:14px;align-items:center;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .cmp:last-child{border:0}
  .cmp-head{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    border-bottom:1px solid var(--line);padding-bottom:8px}
  .cmp .v{display:flex;align-items:center;gap:8px}
  .cmp .v .bar{flex:1}
  .cmp .v span{flex:0 0 42px;text-align:right}
  .tg-link{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .tg-link code{flex:1 1 260px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:9px;padding:8px 11px;font-size:12.5px;overflow:auto;white-space:nowrap}
  .tg-link button{white-space:nowrap}
  .scope{color:var(--muted);font-size:12.5px;margin:-6px 0 12px;
    padding-left:11px;border-left:2px solid var(--line)}
  /* Две роли: менеджер и руководитель. Один разбор, два взгляда. */
  #roles{margin-left:auto;display:inline-flex;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:3px;gap:2px}
  #roles button{background:none;border:0;color:var(--muted);padding:6px 14px;border-radius:7px;
    font-size:13px;cursor:pointer}
  #roles button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.25)}
  #roles:empty{display:none}
  #theme{margin-left:8px}
  nav .who{align-self:center;margin:0 10px 0 4px;font-size:13px;padding:6px 10px}
  nav .who-lbl{align-self:center;color:var(--muted);font-size:12px;margin-left:8px}
  .sec{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .mod{border:1px dashed var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .mod.filled{border-style:solid;background:var(--panel)}
  .mod h3{margin:0 0 8px;font-size:14px}
  .row-deal{display:grid;grid-template-columns:1.6fr .9fr .9fr 1fr auto;gap:12px;align-items:center;
    padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  .row-deal:hover{background:var(--panel-2)}
  .late{color:var(--bad)}
  .vs{position:relative;height:8px;background:var(--panel-2);border-radius:99px}
  .vs i{position:absolute;left:0;top:0;height:100%;border-radius:99px}
  .vs b{position:absolute;top:-4px;width:2px;height:16px;background:var(--fg);opacity:.55}
  /* Команда: карточки в одну линию, листается вбок */
  /* Лента идёт до правого края окна, а не до границы колонки: иначе справа
     остаётся мёртвая полоса, в которой прокрутка не работает. */
  .rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;
    scroll-behavior:smooth;padding:2px 28px 12px 2px;
    margin-right:calc(-1 * max(0px, 100vw - 100% - 44px))}
  .rail > .card{flex:0 0 320px;scroll-snap-align:start;display:flex;flex-direction:column}
  .rail::-webkit-scrollbar{height:8px}
  .rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  .rail::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  .rail-head{display:flex;align-items:center;gap:8px;margin:30px 0 12px}
  .rail-head h2{margin:0}
  .arrow{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;padding:0}
  .arrow:hover{color:var(--fg);border-color:var(--muted)}
  .weak{background:var(--panel-2);border-radius:10px;padding:9px 11px;font-size:13px;margin-top:12px}
  .weak .lbl{color:var(--muted);font-size:12px;margin-bottom:2px}
  .weak .val{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .focus{font-size:13px;margin:10px 0 0;color:var(--muted)}
  .focus b{color:var(--fg);font-weight:600}
  .card-cta{margin-top:auto;padding-top:14px}
  .card-cta button{width:100%}
  /* Лента сделки: коммуникации, склеенные по этапам */
  .thread{margin:4px 0 0}
  .thr-stage{position:relative;border-left:2px solid var(--line);margin-left:5px;padding:0 0 16px 18px}
  .thr-stage:last-child{padding-bottom:2px}
  .thr-stage.open{border-left-color:var(--accent)}
  .thr-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    flex-wrap:wrap;margin-bottom:6px}
  .thr-head b{font-size:14px}
  .thr-head::before{content:'';position:absolute;left:-7px;top:4px;width:12px;height:12px;
    border-radius:99px;background:var(--line);border:3px solid var(--bg)}
  .thr-stage.open .thr-head::before{background:var(--accent)}
  .thr-item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:7px 10px;border-radius:9px;font-size:13px;cursor:pointer}
  .thr-item:hover{background:var(--panel-2)}
  .thr-when{color:var(--muted);flex:0 0 86px}
  .thr-out{flex:1 1 180px;text-align:right}
  .thr-gap{color:var(--muted);font-size:12px;padding:2px 0 0 18px;margin-left:5px}
  .strip{display:inline-flex;gap:3px;vertical-align:middle}
  .strip i{width:20px;height:18px;border-radius:5px;background:var(--panel-2);
    border:1px solid var(--line);font-style:normal;font-size:11px;color:var(--muted);
    display:flex;align-items:center;justify-content:center}
  .strip i.has{background:rgba(91,140,255,.18);border-color:rgba(91,140,255,.45);color:var(--fg)}
  .strip i.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  details.deal{background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:0;margin-bottom:8px}
  details.deal > summary{cursor:pointer;list-style:none;padding:13px 16px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  details.deal > summary::-webkit-details-marker{display:none}
  details.deal[open] > summary{border-bottom:1px solid var(--line)}
  details.deal > summary:hover{background:var(--panel-2);border-radius:var(--radius)}
  .deal-body{padding:14px 16px}
  .deal-name{font-weight:600;flex:1 1 200px}
  .two{display:grid;gap:14px;grid-template-columns:1fr 1fr}
  @media(max-width:860px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1 id="brand">Кабинет продаж</h1>
  <span class="sub" id="profile-note"></span>
  <div id="roles"></div>
  <button id="theme" onclick="toggleTheme()" title="Тёмная или светлая тема">Светлая</button>
</header>

<nav id="tabs"></nav>
<main id="view"></main>

<dialog id="modal">
  <div class="dlg-head">
    <div><strong id="m-title"></strong><div class="sub" id="m-sub"></div></div>
    <button class="x" onclick="document.getElementById('modal').close()">&times;</button>
  </div>
  <div class="dlg-body" id="m-body"></div>
</dialog>

<script src="data.js"></script>
<script src="config.js"></script>
<!-- Появляются по мере прохождения шагов -->
<script src="scores.js" onerror="void 0"></script>
<script src="coach.js" onerror="void 0"></script>
<script src="enrich.js" onerror="void 0"></script>
<script src="deep.js" onerror="void 0"></script>
<script src="telegram.js" onerror="void 0"></script>
<script>
const CFG = window.CABINET_CONFIG || {profile:'b2b', matrix:{extract:[],evaluate:[]}, questions:[]};

/* ------------------------------------------------------------------
   DataSource — единственная точка, которая знает, откуда берутся данные.
   Чтобы подключить свою CRM: поменяйте тела методов, интерфейс не трогайте.
   Подробнее — docs/architecture.md
------------------------------------------------------------------- */
const DataSource = {
  profile(){ return (window.CABINET_DATA||{})[CFG.profile] || {calls:[],chats:[],leads:[],managers:[],profile:{}} },
  calls(){ return this.profile().calls || [] },
  chats(){ return this.profile().chats || [] },
  leads(){ return this.profile().leads || [] },
  managers(){ return this.profile().managers || [] },
  meta(){ return this.profile().profile || {} },
  funnel(){ return (CFG.funnel && CFG.funnel.length) ? CFG.funnel : (this.meta().funnel || []) },
  // все коммуникации одним списком: звонки и переписка склеены по сделке и этапу
  contacts(){
    const calls = this.calls().map(c => ({...c, kind:'call', when:c.date,
      volume:c.duration_min + ' мин', turns:(c.transcript||[]).length}));
    const chats = this.chats().map(c => ({...c, kind:'chat', when:c.date_start,
      volume:(c.messages||[]).length + ' сообщ.', turns:(c.messages||[]).length}));
    return [...calls, ...chats].sort((a,b) => new Date(a.when) - new Date(b.when));
  },
  scores(){ return window.CABINET_SCORES || null },
  coaching(){ return window.CABINET_COACH || null },
  enrichment(){ return window.CABINET_ENRICH || null },
  deep(){ return window.CABINET_DEEP || null },
  telegram(){ return window.CABINET_TELEGRAM || null }
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mgrName = id => (DataSource.managers().find(m => m.id === id) || {}).name || id;
const fmtDate = s => s ? new Date(s).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const money = n => n ? new Intl.NumberFormat('ru-RU').format(n) + ' ₸' : '—';
const stageLabel = code => (DataSource.meta().stage_labels || {})[code] || code;
const grade = (v,max) => { const r = v/(max||10); return r>=.75?'good':r>=.5?'warn':'bad' };

/* Тип продаж: B2B — сделки, B2C — поток заявок. Берётся из профиля шага 0. */
function isB2C(){
  const m = DataSource.meta();
  return CFG.profile === 'b2c' || /b2c|flow/i.test(m.type || '') ||
         DataSource.leads().some(l => 'parent' in l);
}
function scoreOf(id){
  const s = DataSource.scores();
  if(!s) return null;
  return (s.items || s.calls || []).find(x => x.id === id) || null;
}
/* -------------------------------------------------------------------
   Сделка и её коммуникации.

   Атом данных — коммуникация. У неё есть lead_id (с кем разговор)
   и stage — этап, НА КОТОРОМ разговор произошёл. У сделки свой stage —
   тот, где она стоит сейчас. Из этой пары всё и собирается: группируем
   коммуникации по сделке, внутри — по этапу, по дате. Ничего в данные
   добавлять не нужно, переход на этап — это первый разговор на нём.
------------------------------------------------------------------- */
const leadOf = id => DataSource.leads().find(l => l.id === id) || null;
const leadName = id => { const l = leadOf(id); return l ? (l.company || l.parent || id) : '—' };
const plural = (n,a,b,c) => { const d=n%100, e=n%10;
  return d>4&&d<21 ? c : e===1 ? a : e>1&&e<5 ? b : c };
let _now = null;
function dataNow(){                       // «сегодня» базы — последняя активность в ней
  if(!_now){ const a = DataSource.contacts(); _now = a.length ? new Date(a[a.length-1].when) : new Date() }
  return _now;
}
function dealTimeline(leadId, pool){
  const items = (pool || DataSource.contacts()).filter(c => c.lead_id === leadId);
  const groups = [];
  items.forEach(c => {
    const last = groups[groups.length-1];
    if(last && last.stage === c.stage) last.items.push(c); else groups.push({stage:c.stage, items:[c]});
  });
  groups.forEach((g,i) => {
    const start = new Date(g.items[0].when);
    const next = groups[i+1];
    g.open = !next;
    g.days = Math.max(0, Math.round(((next ? new Date(next.items[0].when) : dataNow()) - start)/864e5));
    const sc = g.items.map(c => scoreOf(c.id)).filter(Boolean);
    g.avg = sc.length ? sc.reduce((a,s) => a+s.total, 0)/sc.length : null;
  });
  return groups;
}
function dealThread(leadId, pool){
  const groups = dealTimeline(leadId, pool);
  if(!groups.length) return '<p class="muted small">По этой сделке нет записанных коммуникаций.</p>';
  const term = DataSource.funnel().map(s => s.id || s).slice(-2);   // закрытая сделка нигде не «стоит»
  return '<div class="thread">'+groups.map(g =>
    '<div class="thr-stage'+(g.open?' open':'')+'">'+
      '<div class="thr-head"><b>'+esc(stageLabel(g.stage))+'</b><span class="muted small">'+
        g.items.length+' '+plural(g.items.length,'коммуникация','коммуникации','коммуникаций')+
        (term.indexOf(g.stage) >= 0 ? '' :
          ' · '+g.days+' '+plural(g.days,'день','дня','дней')+(g.open?' и стоит здесь':' на этапе'))+
        (g.avg!=null ? ' · ср. балл '+g.avg.toFixed(1) : '')+
      '</span></div>'+
      g.items.map(c => {
        const s = scoreOf(c.id);
        return '<div class="thr-item" onclick="if(window.openContact)openContact(\''+c.id+'\')">'+
          '<span class="thr-when">'+fmtDate(c.when)+'</span>'+
          '<span class="pill">'+esc(c.kind==='call'?'звонок':(c.channel||'переписка'))+'</span>'+
          '<span class="muted">'+esc(c.volume)+'</span>'+
          '<span class="muted">'+esc(mgrName(c.manager_id))+'</span>'+
          (s ? '<span class="pill '+grade(s.total,10)+'">'+s.total.toFixed(1)+'</span>' : '')+

/* BANT по дням: сколько звонков-квалификаций было и в скольких из них
   прозвучал каждый из четырёх признаков. Это операционный график — он
   отвечает на вопрос «как мы квалифицируем изо дня в день», а не «где в
   воронке стоят деньги». Второй вопрос живёт на вкладке «Глубокая аналитика». */
const BANT_KEYS = ['budget','authority','need','timing'];
const BANT_LBL = {budget:'B · Бюджет', authority:'A · Полномочия',
                  need:'N · Потребность', timing:'T · Сроки'};
const BANT_COL = {budget:'var(--accent)', authority:'var(--good)',
                  need:'var(--bad)', timing:'var(--warn)'};
function bantSeries(){
  const s = DataSource.scores(); if(!s) return null;
  const byId = {}; DataSource.contacts().forEach(c => byId[c.id] = c);
  const calls = (s.items || []).filter(i => i.bant && byId[i.id] && byId[i.id].kind === 'call')
                               .map(i => ({bant: i.bant, when: byId[i.id].when, stage: byId[i.id].stage}));
  if(calls.length < 8) return null;
  const qual = (s.aggregates && s.aggregates.bant && s.aggregates.bant.stage) ||
               (DataSource.funnel().map(x => x.id || x)[1]);
  const q = calls.filter(c => c.stage === qual);
  // если звонков на этапе квалификации мало, честнее показать все, чем пустой график
  const use = q.length >= 12 ? q : calls;
  const scope = use === q ? qual : null;

  const days = new Set(use.map(c => c.when.slice(0,10)));
  const byWeek = days.size > 45 || use.length / days.size < 2;
  const key = c => {
    if(!byWeek) return c.when.slice(0,10);
    const d = new Date(c.when.slice(0,10));
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d.toISOString().slice(0,10);
  };
  const map = {};
  use.forEach(c => {
    const k = key(c);
    const b = map[k] || (map[k] = {key:k, total:0, budget:0, authority:0, need:0, timing:0});
    b.total++;
    BANT_KEYS.forEach(x => { if(c.bant[x]) b[x]++ });
  });
  return {buckets: Object.values(map).sort((a,b) => a.key < b.key ? -1 : 1),
          byWeek, scope, calls: use.length};
}
function bantDailyChart(){
  const d = bantSeries(); if(!d || d.buckets.length < 2) return '';
  const B = d.buckets, n = B.length;
  const W = 1000, H = 300, L = 36, R = 10, T = 14, Bm = 34;
  const pw = W - L - R, ph = H - T - Bm;
  const raw = Math.max(4, ...B.map(b => b.total));
  const tick = Math.ceil(raw / 4), max = tick * 4;   // подписи оси — целые числа
  const y = v => T + ph - (v / max) * ph;
  const gw = pw / n, bw = Math.max(2, Math.min(10, (gw - 6) / 4));

  let g = '';
  for(let i = 0; i <= 4; i++){
    const v = tick * i, yy = y(v);
    g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>'+
         '<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>';
  }
  let bars = '', pts = [];
  B.forEach((b,i) => {
    const x0 = L + gw*i + (gw - bw*4)/2;
    pts.push((L + gw*i + gw/2).toFixed(1)+','+y(b.total).toFixed(1));
    BANT_KEYS.forEach((k,j) => {
      const h = Math.max(0, T + ph - y(b[k]));
      bars += '<rect x="'+(x0 + j*bw).toFixed(1)+'" y="'+y(b[k]).toFixed(1)+'" width="'+(bw-1).toFixed(1)+
              '" height="'+h.toFixed(1)+'" fill="'+BANT_COL[k]+'" rx="1"/>';
    });
    bars += '<rect x="'+(L+gw*i).toFixed(1)+'" y="'+T+'" width="'+gw.toFixed(1)+'" height="'+ph+
            '" fill="transparent"><title>'+esc(fmtBucket(b.key, d.byWeek))+'\nВсего звонков: '+b.total+
            BANT_KEYS.map(k => '\n'+BANT_LBL[k]+': '+b[k]).join('')+'</title></rect>';
  });
  const step = Math.ceil(n / 12);
  let xl = '';
  B.forEach((b,i) => { if(i % step) return;
    xl += '<text x="'+(L + gw*i + gw/2).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11" '+
          'fill="var(--muted)">'+esc(fmtBucket(b.key, d.byWeek).slice(0,5))+'</text>';
  });
  const legend = '<div class="legend">'+BANT_KEYS.map(k =>
      '<span><b style="background:'+BANT_COL[k]+'"></b>'+esc(BANT_LBL[k])+'</span>').join('')+
    '<span><b style="background:var(--accent);height:3px;width:16px;border-radius:2px"></b>всего звонков</span></div>';
  const what = d.scope ? 'звонков-квалификаций на этапе «'+esc(stageLabel(d.scope))+'»'
                       : 'звонков по всем этапам (на этапе квалификации их пока мало)';
  return '<h2>Квалификация по BANT: '+(d.byWeek ? 'по неделям' : 'по дням')+'</h2>'+
    '<p class="scope">Линия — сколько было '+what+' в '+(d.byWeek ? 'неделю' : 'день')+
      '. Столбцы — в скольких из них прозвучал каждый признак. Разрыв между линией и столбцами '+
      'и есть объём работы, которая ушла дальше по воронке без ответа.</p>'+
    legend+'<div class="card" style="padding:14px 16px">'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" '+
      'preserveAspectRatio="xMidYMid meet">'+g+bars+xl+
      '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".85"/>'+
      pts.map(p => { const [a,c] = p.split(','); return '<circle cx="'+a+'" cy="'+c+'" r="2.6" fill="var(--accent)"/>' }).join('')+
    '</svg></div>';
}
function fmtBucket(k, week){
  const d = new Date(k), s = d.toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'});
  return week ? s+' — неделя' : s;

/* BANT по всей воронке. Квалификация копится по сделке: признак мог
   прозвучать на первом звонке, а КП отправляют после четвёртого. Поэтому
   считаем объединение по всем коммуникациям сделки, а не по одной.
   Если scores.js принёс готовый разрез — берём его, иначе считаем сами. */
function bantByStage(){
  const s = DataSource.scores(); if(!s) return null;
  if(s.aggregates && s.aggregates.bant_by_stage) return s.aggregates.bant_by_stage;
  const items = (s.items || []).filter(i => i.bant && i.lead_id);
  if(!items.length) return null;
  const keys = Object.keys(items[0].bant);
  const per = {};
  items.forEach(i => {
    const e = per[i.lead_id] || (per[i.lead_id] = {});
    keys.forEach(k => { if(i.bant[k]) e[k] = true });
  });
  const leads = DataSource.leads();
  const stages = DataSource.funnel().map(x => x.id || x);
  const rows = stages.map(st => {
    const ls = leads.filter(l => l.stage === st && per[l.id]);
    const full = ls.filter(l => keys.every(k => per[l.id][k]));
    const none = ls.filter(l => !keys.some(k => per[l.id][k]));
    return {stage: st, label: stageLabel(st), leads: ls.length, full: full.length,
            partial: ls.length - full.length - none.length, none: none.length,
            money: ls.reduce((a,l) => a + (l.value_kzt||0), 0),
            money_full: full.reduce((a,l) => a + (l.value_kzt||0), 0)};
  });
  return {deals: Object.keys(per).length, stages: rows,
          labels: {budget:'Бюджет', authority:'Полномочия', need:'Потребность', timing:'Сроки'}};
}
function bantChart(){
  const q = bantByStage(); if(!q) return '';
  const rows = q.stages.filter(r => r.leads);
  if(!rows.length) return '';

  const full = rows.reduce((a,r) => a + r.full, 0);
  return '<h2>Квалификация по BANT на каждом этапе</h2>'+

/* Копирование без библиотек: на file:// Clipboard API есть не везде. */
function copyText(t, btn){
  const done = () => { if(!btn) return; const was = btn.textContent;
    btn.textContent = 'Скопировано'; setTimeout(() => btn.textContent = was, 1400) };
  try { navigator.clipboard.writeText(t).then(done, () => fallback(t, done)) }
  catch(e){ fallback(t, done) }
}
function fallback(t, done){
  const a = document.createElement('textarea');
  a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); done() } catch(e){}
  document.body.removeChild(a);
}

/* -------------------------------------------------------------------

   Ответственный — поле CRM. Если его нет в выгрузке, берём менеджера,
   который вёл разговоры по сделке.

   Скоринг — логика майского скилла lead-scoring: 0–100, категории A/B/C,
   веса адаптивные под полноту данных. Есть разговоры — главный сигнал
   в них. Нет — работают соответствие профилю и свежесть заявки.
   B2B: здоровье сделки. B2C: приоритет заявки. Считается при открытии

let _own = null;
function ownerOf(l){

  if(!_own){ _own = {}; DataSource.contacts().forEach(c => { if(!_own[c.lead_id]) _own[c.lead_id] = c.manager_id }) }

}
const touch = id => ((DataSource.enrichment() || {}).touch || []).find(t => t.lead_id === id) || null;
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
const closedStage = st => { const f = DataSource.funnel().map(x => x.id || x); return f.length > 2 && f.slice(-2).includes(st) };

let _sig = null;
function leadSignals(){
  if(_sig) return _sig;
  _sig = {};
  const s = DataSource.scores();
  const sc = {}; ((s && s.items) || []).forEach(i => sc[i.id] = i);
  const BUY = ['когда старт','расписан','оплат','счёт','рассрочк','сколько стоит','договор','пилот','когда можно','давайте','подходит'];
  DataSource.contacts().forEach(c => {
    const e = _sig[c.lead_id] || (_sig[c.lead_id] = {n:0, last:null, totals:[], bant:{}, buy:0});
    e.n++;
    const w = new Date(c.when); if(!e.last || w > e.last) e.last = w;
    const i = sc[c.id];
    if(i){ e.totals.push(i.total); if(i.bant) Object.keys(i.bant).forEach(k => { if(i.bant[k]) e.bant[k] = true }) }
    const turns = c.transcript || c.messages || [];
    turns.forEach(t => { if(t.who === 'client'){ const x = (t.text||'').toLowerCase();

  });

}
function leadScore(l){
  if(!l || closedStage(l.stage)) return null;

  const age = created ? daysBetween(created, now) : null;
  const clip = v => Math.max(0, Math.min(100, v));

  if(isB2C()){

    fit += ({'Рекомендация':40,'Сайт':30,'Instagram':20})[l.source] ?? 15;
    rec = age === null ? 30 : age <= 1 ? 100 : age <= 3 ? 80 : age <= 7 ? 50 : age <= 14 ? 20 : 0;

      conv += e.bant.budget ? 15 : 0;

    } else total = .5*clip(fit) + .5*rec;

    fit += l.size ? (l.size >= 50 && l.size <= 500 ? 30 : l.size > 500 ? 25 : 15) : 5;
    fit += l.industry ? 15 : 0;
    fit += ({'Рекомендация':15,'Выставка':12,'Сайт':10,'Вебинар':10})[l.source] ?? 0;
    const last = e && e.last;
    rec = last ? (d => d <= 7 ? 100 : d <= 14 ? 60 : d <= 30 ? 20 : 0)(daysBetween(last, now))

      const nb = Object.keys(e.bant).length;
      let buy = nb === 4 ? 50 : nb * 10;
      const ns = l.next_step ? new Date(l.next_step) : null;
      buy += ns ? (ns >= now ? 30 : -10) : 0;
      buy += e.buy ? 20 : 0;
      const avg = e.totals.length ? e.totals.reduce((a,b) => a+b, 0) / e.totals.length : null;
      const eng = (e.n >= 5 ? 60 : e.n >= 3 ? 40 : 20) + (avg == null ? 0 : avg >= 7 ? 40 : avg >= 5 ? 20 : 0);

      if(nb === 4) why.push('BANT закрыт полностью'); else why.push('BANT: выяснено '+nb+' из 4');
      if(ns && ns < now) why.push('следующий шаг просрочен');
      if(!ns) why.push('следующего шага нет');
      if(last && daysBetween(last, now) > 14) why.push('без контакта '+daysBetween(last, now)+' дн.');
    } else {

    }
  }
  const score = Math.round(clip(total));
  return {score, grade: score >= 65 ? 'A' : score >= 40 ? 'B' : 'C', why: why.slice(0, 3)};
}
function scorePill(r){
  if(!r) return '<span class="pill">—</span>';
  const cls = r.grade === 'A' ? 'good' : r.grade === 'B' ? 'warn' : 'bad';
  return '<span class="pill '+cls+'" title="'+esc(r.why.join(' · '))+'">'+r.grade+' · '+r.score+'</span>';
}

/* Карточка сделки или заявки — центральный объект менеджера:
   до контакта · лента всех разговоров · после контакта. */
function openDeal(id){
  const l = leadOf(id); if(!l) return;
  const b2c = isB2C(), t = touch(id), r = leadScore(l);
  const own = DataSource.managers().find(m => m.id === ownerOf(l));
  $('#m-title').textContent = leadName(id);
  $('#m-sub').textContent = [stageLabel(l.stage), money(l.value_kzt), own && ('ответственный: '+own.name),
    l.source && ('источник: '+l.source)].filter(Boolean).join(' · ');
  let body = '';

  // ── до контакта
  body += '<div class="sec">До контакта</div>';
  if(t && t.before){
    const bf = t.before;
    body += '<div class="mod filled"><h3>Повод касания</h3><p class="small" style="margin:0">'+esc(bf.reason||'')+'</p>'+
      ((bf.memory||[]).length ? '<div class="kpi-label" style="margin-top:12px">Из прошлых разговоров</div>'+
        bf.memory.map(x => '<div class="crit"><span class="small">'+esc(x)+'</span></div>').join('') : '')+
      ((bf.events||[]).length ? '<div class="kpi-label" style="margin-top:12px">Что произошло у клиента</div>'+
        bf.events.map(x => '<div class="crit"><span class="small">'+esc(x)+'</span></div>').join('') : '')+
      (bf.dossier ? '<div class="kpi-label" style="margin-top:12px">'+(b2c?'Контекст заявки':'Досье ЛПР')+'</div>'+
        '<p class="small" style="margin:4px 0 0">'+esc(bf.dossier)+'</p>' : '')+
      (t.message ? '<div class="kpi-label" style="margin-top:12px">Сообщение для касания</div>'+
        '<div class="tg" style="margin-top:6px">'+esc(t.message)+'</div>' : '')+'</div>';
  } else {
    let pre = '';
    if(b2c){
      // только те поля, что есть в базе участника: у школы «возраст ребёнка», у клиники его нет
      [['интерес', l.interest], ['сегмент', !l.interest && l.industry], ['возраст ребёнка', l.child_age && l.child_age+' лет'],
       ['контакт', l.contact && l.contact !== leadName(id) && l.contact], ['источник', l.source],
       ['первый ответ', l.responded_in_min != null && l.responded_in_min+' мин']].filter(x => x[1]).forEach(([k,v]) =>
        pre += '<div class="crit"><span class="muted">'+k+'</span><span>'+esc(v)+'</span></div>');
    } else {
      pre += '<div class="crit"><span class="muted">контакт</span><span>'+esc([l.contact, l.position].filter(Boolean).join(', ')||'—')+'</span></div>';
      (l.events||[]).forEach(ev => pre += '<div class="crit"><span class="muted">'+esc(fmtDate(ev.date).slice(0,5))+' · '+
        esc(({news:'новость',vacancy:'вакансия',tender:'тендер'})[ev.type]||ev.type)+'</span><span class="small" style="max-width:70%;text-align:right">'+esc(ev.title)+'</span></div>');
    }
    body += '<div class="mod">'+pre+'<p class="muted small" style="margin:10px 0 0">Повод касания'+
      (b2c ? '' : ', досье ЛПР')+' и сообщение появятся после шага 3: скажите агенту <code>следующее касание</code>.</p></div>';
  }
  if(r) body += '<p class="muted small" style="margin:-4px 0 12px">'+(b2c?'Приоритет заявки':'Здоровье сделки')+': '+
    scorePill(r)+' '+esc(r.why.join(' · '))+'</p>';

  // ── разговоры
  body += '<div class="sec">Все разговоры по '+(b2c?'заявке':'сделке')+'</div>'+dealThread(id);

  // ── после контакта
  body += '<div class="sec">После контакта</div>';
  if(t && t.after){
    const a = t.after;
    body += '<div class="mod filled"><h3>Автозадачи</h3>'+
      (a.summary ? '<p class="small" style="margin:0 0 10px">'+esc(a.summary)+'</p>' : '')+
      ((a.agreements||{}).we||[]).map(x => '<div class="crit"><span class="muted">мы</span><span class="small" style="max-width:80%;text-align:right">'+esc(x)+'</span></div>').join('')+
      ((a.agreements||{}).client||[]).map(x => '<div class="crit"><span class="muted">клиент</span><span class="small" style="max-width:80%;text-align:right">'+esc(x)+'</span></div>').join('')+
      ((a.tasks||[]).length ? '<div class="kpi-label" style="margin-top:12px">Задачи</div>'+
        a.tasks.map(x => '<div class="crit"><span class="small">'+esc(x.text||x)+'</span><span class="muted small">'+esc(x.due||'')+'</span></div>').join('') : '')+
      (a.email ? '<div class="kpi-label" style="margin-top:12px">Письмо клиенту</div><div class="tg" style="margin-top:6px">'+esc(a.email)+'</div>' : '')+
      (a.crm ? '<div class="kpi-label" style="margin-top:14px">Уйдёт в CRM</div>'+
        Object.entries(a.crm).map(([k,v]) => '<div class="crit"><span class="muted">'+esc(k)+'</span><span class="small" style="max-width:70%;text-align:right">'+esc(v)+'</span></div>').join('') : '')+
      '</div>';
    if(t.offer) body += '<div class="mod filled"><h3>'+(b2c ? 'Ответ в мессенджер' : 'КП')+'</h3>'+
      (t.offer.spsv ? Object.entries(t.offer.spsv).map(([k,v]) => '<div class="crit"><span class="muted">'+esc(k)+'</span><span class="small" style="max-width:75%;text-align:right">'+esc(v)+'</span></div>').join('') : '')+
      (t.offer.text ? '<div class="tg" style="margin-top:10px">'+esc(t.offer.text)+'</div>' : '')+'</div>';
  } else {
    body += '<div class="mod"><p class="muted small" style="margin:0">Саммари, договорённости обеих сторон, задачи, письмо клиенту '+
      'и превью того, что уйдёт в CRM, появятся после шага 3'+(b2c ? ', вместе с ответом в мессенджер.' : ', вместе с КП.')+'</p></div>';
  }
  $('#m-body').innerHTML = body;
  $('#modal').showModal();
}
function emptyBlock(title, hint, step){
  return '<div class="empty"><b>'+esc(title)+'</b>'+esc(hint)+'<br><br>'+
    '<span class="muted">Появится после</span> <code>'+esc(step)+'</code></div>';
}
function kpi(label, value, note){
  return '<div class="card"><div class="kpi-label">'+esc(label)+'</div><div class="kpi">'+esc(value)+'</div>'+
    (note ? '<div class="kpi-note">'+esc(note)+'</div>' : '')+'</div>';
}

/* ---------------------------- Каркас ---------------------------- */
/* Вкладки регистрируются подключёнными блоками — см. blocks/ */
const TABS = [];
/* Вкладки менеджера и руководителя. Блок сам говорит, чья это вкладка:
   role:'manager' или по умолчанию руководитель. */
const TAB_ORDER = ['my-deals','my-calls','my-coach',
                   'overview','contacts','managers','leads','insights','deep'];
function registerTab(t){
  t.role = t.role || 'lead';
  TABS.push(t);
  TABS.sort((a,b) => TAB_ORDER.indexOf(a.id) - TAB_ORDER.indexOf(b.id));
}
const ROLE_LBL = {manager:'Менеджер', lead:'Руководитель'};
let active = null, role = null;
const roleTabs = r => TABS.filter(t => t.role === r);
const store = {get(k){ try { return localStorage.getItem(k) } catch(e){ return null } },
               set(k,v){ try { localStorage.setItem(k, v) } catch(e){} }};

/* «Кто я». В прототипе — выпадающий список, в реальной работе у каждого свой вход. */
function me(){
  const ms = DataSource.managers();
  const saved = store.get('cabinet-me');
  if(saved && ms.find(m => m.id === saved)) return saved;
  const n = {}; DataSource.contacts().forEach(c => n[c.manager_id] = (n[c.manager_id]||0) + 1);
  const top = ms.slice().sort((a,b) => (n[b.id]||0) - (n[a.id]||0))[0];
  return top ? top.id : null;
}
function setMe(id){ store.set('cabinet-me', id); draw(); }
function setRole(r){ role = r; store.set('cabinet-role', r); active = null; draw(); }

function draw(){
  const both = ['manager','lead'].filter(r => roleTabs(r).length);
  if(!role || !both.includes(role)) role = both[0] || 'lead';
  $('#roles').innerHTML = both.length > 1 ? both.map(r =>
    '<button class="'+(r===role?'on':'')+'" onclick="setRole(\''+r+'\')">'+ROLE_LBL[r]+'</button>').join('') : '';
  const tabs = roleTabs(role);
  if(!tabs.find(t => t.id === active)) active = tabs.length ? tabs[0].id : null;
  let who = '';
  if(role === 'manager'){
    const cur = me();
    who = '<span class="who-lbl">Я</span><select class="who" onchange="setMe(this.value)">'+
      DataSource.managers().map(m => '<option value="'+esc(m.id)+'"'+(m.id===cur?' selected':'')+'>'+
        esc(m.name)+'</option>').join('')+'</select>';
  }
  $('#tabs').innerHTML = who + tabs.map(t => '<button class="'+(t.id===active?'on':'')+
    '" onclick="go(\''+t.id+'\')">'+(typeof t.label === 'function' ? t.label() : t.label)+'</button>').join('');
  const t = tabs.find(x => x.id === active);
  $('#view').innerHTML = t ? t.render() : '';
}
function go(id){
  const t = TABS.find(x => x.id === id);
  if(t && t.role !== role) role = t.role;
  active = id; draw();
}

/* Тема. Выбор запоминается в браузере; если хранилище недоступно —
   просто работает тёмная, ничего не ломается. */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('theme');
  if(b) b.textContent = t === 'light' ? 'Тёмная' : 'Светлая';
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('cabinet-theme', next); } catch(e){}
}
(function initTheme(){
  // по умолчанию тёмная: кабинет часто показывают с проектора
  let saved = null;
  try { saved = localStorage.getItem('cabinet-theme'); } catch(e){}
  applyTheme(saved === 'light' ? 'light' : 'dark');
})();

function boot(){
  const meta = DataSource.meta();
  $('#brand').textContent = (CFG.company && CFG.company !== 'Демо-режим')
    ? 'Кабинет продаж · '+CFG.company : 'Кабинет продаж';
  $('#profile-note').textContent = [meta.title, meta.what_we_sell].filter(Boolean).join(' · ');
  if(meta.synthetic){
    const b = document.createElement('span');
    b.className = 'pill warn'; b.style.marginLeft = '4px';
    b.textContent = 'данные синтетические';
    b.title = 'База сгенерирована под профиль вашей компании. Выводы показывают механику, а не факты о ваших людях.';
    document.querySelector('header').appendChild(b);
  }
  // первым открываем менеджера: «один разбор, два взгляда» начинается с себя
  role = store.get('cabinet-role');
  draw();
}

</script>
<script>
/* Блок «Менеджер». Подключается сборщиком: scripts/build_cabinet.py */
/* -------------------------- РАБОЧЕЕ МЕСТО МЕНЕДЖЕРА -------------------------- */
/* Один разбор, два взгляда: руководитель видит отдел, менеджер — себя.
   Здесь всё про одного человека, которого он выбрал в «Я».              */
function myLeads(){ const id = me(); return DataSource.leads().filter(l => ownerOf(l) === id) }
function lastTouch(id){
  const cs = DataSource.contacts().filter(c => c.lead_id === id);
  return cs.length ? new Date(cs[cs.length-1].when) : null;
}

/* ── Мои сделки (B2B) / Моя очередь (B2C) ── */
function renderMyDeals(){
  const b2c = isB2C(), now = dataNow();
  const all = myLeads(), open = all.filter(l => !closedStage(l.stage));
  if(!all.length) return emptyBlock('За вами пока нет '+(b2c?'заявок':'сделок'),
    'В базе нет поля «ответственный» или выбран человек без портфеля. Выберите другого в списке «Я».', 'шага 0');

  if(b2c){
    // Сколько клиент ждёт нас: с последнего разговора, а если его не было — с заявки.
    // Колонки из общих полей базы: у школы это «интерес», у клиники — «сегмент».
    const rows = open.map(l => { const lt = lastTouch(l.id);
      const from = lt || (l.created ? new Date(l.created) : null);
      return {l, r: leadScore(l), lt, wait: from ? daysBetween(from, now) : null} })
      .sort((a,b) => ((b.r&&b.r.score)||0) - ((a.r&&a.r.score)||0) || (b.wait||0) - (a.wait||0));
    const extra = l => l.interest || l.industry || '—';
    const extraLbl = open.some(l => l.interest) ? 'Интерес' : 'Сегмент';
    return '<div class="grid" style="margin-bottom:14px">'+
      kpi('В очереди', open.length, 'открытых заявок')+
      kpi('Приоритет A', rows.filter(x => x.r && x.r.grade === 'A').length, 'звонить сегодня')+
      kpi('Без ответа', rows.filter(x => !x.lt).length, 'ещё не было разговора')+
      kpi('Ждут дольше 3 дней', rows.filter(x => x.wait > 3).length, 'с последнего касания')+'</div>'+
      '<p class="scope">Сверху — заявки, которые скорее всего купят, если позвонить сейчас. Приоритет считает код: свежесть, соответствие профилю и то, что клиент говорил в разговорах.</p>'+
      '<table><thead><tr><th>Клиент</th><th>'+extraLbl+'</th><th>Источник</th><th>Ждёт</th><th>Первый ответ</th><th>Приоритет</th></tr></thead><tbody>'+
      rows.map(x => '<tr class="clickable" onclick="openDeal(\''+x.l.id+'\')"><td>'+esc(leadName(x.l.id))+'</td>'+
        '<td class="muted">'+esc(extra(x.l))+'</td><td class="muted">'+esc(x.l.source||'—')+'</td>'+
        '<td class="'+(x.wait > 3 ? 'late' : 'muted')+'">'+(x.wait != null ? x.wait+' дн.'+(x.lt ? '' : ' · новая') : '—')+'</td>'+
        '<td class="muted">'+(x.l.responded_in_min != null ? x.l.responded_in_min+' мин' : '—')+'</td>'+
        '<td>'+scorePill(x.r)+'</td></tr>').join('')+'</tbody></table>';
  }

  const info = open.map(l => {
    const last = lastTouch(l.id), ns = l.next_step ? new Date(l.next_step) : null;
    return {l, last, ns, idle: last ? daysBetween(last, now) : null,
            late: ns && ns < now, stuck: last && daysBetween(last, now) > 14, r: leadScore(l)};
  });
  const sum = open.reduce((a,l) => a + (l.value_kzt||0), 0);
  const won = all.filter(l => l.stage === DataSource.funnel().map(x => x.id||x).slice(-2)[0]).length;
  let html = '<div class="grid" style="margin-bottom:6px">'+
    kpi('Сделок в работе', open.length, money(sum))+
    kpi('Застряли', info.filter(x => x.stuck).length, 'без контакта больше 14 дней')+
    kpi('Следующий шаг просрочен', info.filter(x => x.late).length, 'или его нет: '+info.filter(x => !x.ns).length)+
    kpi('Закрыто', won, 'выиграно из '+(all.length - open.length)+' закрытых')+'</div>';
  const stages = DataSource.funnel().map(x => x.id||x).filter(s => !closedStage(s));
  stages.forEach(st => {
    const rows = info.filter(x => x.l.stage === st)
      .sort((a,b) => (b.late - a.late) || (b.stuck - a.stuck) || (b.l.value_kzt||0) - (a.l.value_kzt||0));
    if(!rows.length) return;
    html += '<h2>'+esc(stageLabel(st))+' · '+rows.length+' · '+money(rows.reduce((a,x) => a + (x.l.value_kzt||0), 0))+'</h2><div class="card" style="padding:4px 6px">'+
      rows.map(x => '<div class="row-deal" onclick="openDeal(\''+x.l.id+'\')">'+
        '<div><b>'+esc(leadName(x.l.id))+'</b><div class="muted small">'+esc([x.l.contact, x.l.position].filter(Boolean).join(', '))+'</div></div>'+
        '<div>'+money(x.l.value_kzt)+'</div>'+
        '<div class="'+(x.stuck ? 'late' : 'muted')+' small">'+(x.last ? 'контакт '+x.idle+' дн. назад' : 'разговоров нет')+'</div>'+
        '<div class="'+(x.late || !x.ns ? 'late' : 'muted')+' small">'+(x.ns ? (x.late ? 'шаг просрочен · ' : 'шаг · ')+fmtDate(x.l.next_step).slice(0,5) : 'следующего шага нет')+'</div>'+
        '<div>'+scorePill(x.r)+'</div></div>').join('')+'</div>';
  });
  return html;
}

/* ── Мои звонки: семь показателей в сравнении с командой ── */
function renderMyCalls(){
  const s = DataSource.scores(), id = me();
  if(!s) return emptyBlock('Разговоры ещё не разобраны', 'После разбора здесь появится ваша оценка по семи показателям рядом со средней по команде.', 'шага 1');
  const items = s.items || [], byId = {};
  DataSource.contacts().forEach(c => byId[c.id] = c);
  const mine = items.filter(i => byId[i.id] && byId[i.id].manager_id === id);
  if(!mine.length) return emptyBlock('У вас пока нет разобранных разговоров', 'Выберите в списке «Я» другого менеджера.', 'шага 1');
  const avgOf = (arr, key) => { const v = arr.map(i => (i.evaluate||[]).find(e => e.id === key)).filter(Boolean).map(e => e.value);
    return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null };
  const keys = (mine[0].evaluate || []).map(e => ({id: e.id, name: e.name}));
  const tot = arr => arr.reduce((a,i) => a + i.total, 0) / arr.length;
  const my = tot(mine), team = tot(items);
  const ranks = DataSource.managers().map(m => { const x = items.filter(i => byId[i.id] && byId[i.id].manager_id === m.id);
    return {id: m.id, v: x.length ? tot(x) : -1} }).sort((a,b) => b.v - a.v);
  let html = '<div class="grid" style="margin-bottom:14px">'+
    kpi('Мой средний балл', my.toFixed(1), 'по '+mine.length+' разговорам')+
    kpi('Средний по команде', team.toFixed(1), 'все разговоры отдела')+
    kpi('Место в команде', (ranks.findIndex(r => r.id === id) + 1)+' из '+ranks.length, 'по среднему баллу')+'</div>';
  html += '<h2>Семь показателей: я и команда</h2><p class="scope">Полоса — ваш средний, риска — средний по отделу. Смотрите не на самую короткую полосу, а на самый большой разрыв с командой: он и есть фокус недели.</p><div class="card">'+
    keys.map(k => { const a = avgOf(mine, k.id), b = avgOf(items, k.id); if(a == null) return '';
      const gap = a - b;
      return '<div class="skill"><div class="lbl"><span>'+esc(k.name)+'</span><span class="muted">'+a.toFixed(1)+
        ' <span style="opacity:.7">· команда '+b.toFixed(1)+'</span> '+
        '<span class="'+(gap < -0.5 ? 'late' : gap > 0.5 ? '' : 'muted')+'" style="'+(gap > 0.5 ? 'color:var(--good)' : '')+'">'+
        (gap >= 0 ? '+' : '')+gap.toFixed(1)+'</span></span></div>'+
        '<div class="vs"><i class="" style="width:'+Math.round(a*10)+'%;background:var(--'+(grade(a,10)==='good'?'good':grade(a,10)==='warn'?'warn':'bad')+')"></i>'+
        '<b style="left:calc('+Math.round(b*10)+'% - 1px)"></b></div></div>' }).join('')+'</div>';
  const recent = mine.slice().sort((a,b) => new Date(byId[b.id].when) - new Date(byId[a.id].when)).slice(0, 12);
  html += '<h2>Последние разговоры</h2><table><thead><tr><th>Дата</th><th>Клиент</th><th>Канал</th><th>Этап</th><th>Балл</th><th>Итог</th></tr></thead><tbody>'+
    recent.map(i => { const c = byId[i.id];
      return '<tr class="clickable" onclick="openContact(\''+c.id+'\')"><td>'+fmtDate(c.when)+'</td><td>'+esc(leadName(c.lead_id))+'</td>'+
        '<td><span class="pill">'+esc(c.kind==='call'?'звонок':(c.channel||'переписка'))+'</span></td>'+
        '<td><span class="pill">'+esc(stageLabel(c.stage))+'</span></td>'+
        '<td><span class="pill '+grade(i.total,10)+'">'+i.total.toFixed(1)+'</span></td><td class="muted small">'+esc(c.outcome||'')+'</td></tr>' }).join('')+
    '</tbody></table>';
  return html;
}

/* ── Мой тренер ── */
function renderMyCoach(){
  const id = me(), coach = DataSource.coaching();
  const fb = coach ? (coach.managers||[]).find(x => x.id === id) : null;
  if(!fb) return emptyBlock(coach ? 'Разбора для вас в этот раз нет' : 'Тренер ещё не подключён',
    coach ? 'Подробный разбор пишется тем, у кого он изменит поведение. Карта навыков — во вкладке «Мои звонки».'
          : 'Здесь появится разбор ваших разговоров, тренировка под слабый навык и доставка в Telegram.', 'шага 2');
  let html = '';
  if((fb.skills||[]).length){
    html += '<div class="card" style="margin-bottom:14px"><div class="kpi-label">Карта навыков</div>'+
      fb.skills.map(s => '<div class="skill"><div class="lbl"><span>'+esc(s.name)+'</span><span class="muted">'+s.value+'/'+(s.max||10)+'</span></div>'+
        '<div class="bar '+grade(s.value,s.max||10)+'"><i style="width:'+Math.round(s.value/(s.max||10)*100)+'%"></i></div></div>').join('')+'</div>';
  }
  return html + coachBody(id);
}

<script>
/* Блок «Обзор». Дашборд про цифры: метрики, воронка, качество, команда.
   Подключается сборщиком: scripts/build_cabinet.py */

function ovStats(){
  const contacts = DataSource.contacts(), leads = DataSource.leads(), sc = DataSource.scores();
  const items = sc ? (sc.items || sc.calls || []) : [];
  const byId = {}; items.forEach(i => byId[i.id] = i);
  const scored = contacts.map(c => byId[c.id]).filter(Boolean);
  const avg = scored.length ? scored.reduce((a,s)=>a+s.total,0)/scored.length : null;
  const won = leads.filter(l => l.stage === 'closed_won' || l.stage === 'payment').length;
  const lost = leads.filter(l => l.stage === 'closed_lost').length;
  const pipeline = leads.filter(l => !['closed_won','closed_lost'].includes(l.stage))
                        .reduce((a,l)=>a+(l.value_kzt||0),0);
  return {contacts, leads, items, byId, scored, avg, won, lost, pipeline};
}

function bigKpi(label, value, sub, tone){
  const color = tone ? 'var(--'+tone+')' : 'var(--fg)';
  return '<div class="card"><div class="kpi-label">'+esc(label)+'</div>'+
    '<div class="kpi" style="color:'+color+'">'+esc(value)+'</div>'+
    (sub ? '<div class="kpi-note">'+esc(sub)+'</div>' : '')+'</div>';
}

/* Горизонтальная воронка: ширина полосы = число контактов, подпись = деньги на этапе */
function ovFunnel(S){
  const fn = DataSource.funnel(); if(!fn.length) return '';
  const rows = fn.map(s => {
    const cs = S.contacts.filter(c => c.stage === s.id);
    const ls = S.leads.filter(l => l.stage === s.id);
    const money = ls.reduce((a,l)=>a+(l.value_kzt||0),0);
    const sc = cs.map(c => S.byId[c.id]).filter(Boolean);
    const avg = sc.length ? sc.reduce((a,x)=>a+x.total,0)/sc.length : null;
    return {s, n: cs.length, leads: ls.length, money, avg};
  });
  const max = Math.max(1, ...rows.map(r => r.n));
  let html = '<h2>Воронка · где стоят сделки</h2><div class="card">';
  rows.forEach(r => {
    const w = Math.max(4, Math.round(r.n / max * 100));
    const focus = r.s.id === CFG.focus_stage;
    html += '<div style="margin-bottom:16px">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px">'+
        '<span style="font-size:14px'+(focus?';color:var(--accent);font-weight:600':'')+'">'+esc(r.s.label)+
          (focus?' <span class="pill accent" style="font-size:11px">фокус</span>':'')+'</span>'+
        '<span class="muted small">'+r.n+' контактов · '+r.leads+' сделок'+
          (r.money ? ' · '+money(r.money) : '')+'</span></div>'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<div class="bar" style="flex:1;height:14px">'+
          '<i style="width:'+w+'%;background:'+(focus?'var(--accent)':'rgba(139,147,167,.55)')+'"></i></div>'+
        (r.avg!==null ? '<span class="pill '+grade(r.avg,10)+'" style="min-width:46px;text-align:center">'+r.avg.toFixed(1)+'</span>'
                      : '<span class="pill" style="min-width:46px"> </span>')+
      '</div></div>';
  });
  return html + '</div>';
}

/* Распределение оценок: сколько разговоров в каждом диапазоне */
function ovHistogram(S){
  if(!S.scored.length) return '';
  const buckets = [0,0,0,0,0];
  S.scored.forEach(s => buckets[Math.min(4, Math.floor(s.total/2))]++);
  const max = Math.max(...buckets);
  const labels = ['0–2','2–4','4–6','6–8','8–10'];
  const tones = ['bad','bad','warn','good','good'];
  let html = '<div class="card"><div class="kpi-label">Распределение оценок</div>'+
    '<div style="display:flex;align-items:flex-end;gap:10px;height:120px;margin:18px 0 10px">';
  buckets.forEach((b,i) => {
    const h = max ? Math.max(4, Math.round(b/max*100)) : 4;
    html += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">'+
      '<span class="muted small">'+b+'</span>'+
      '<div style="width:100%;height:'+h+'%;border-radius:6px 6px 0 0;background:var(--'+tones[i]+');opacity:.85"></div>'+
      '</div>';
  });
  html += '</div><div style="display:flex;gap:10px">'+
    labels.map(l => '<span class="muted small" style="flex:1;text-align:center">'+l+'</span>').join('')+
    '</div></div>';
  return html;
}

/* Команда: топ и низ, чтобы разрыв был виден сразу */
function ovTeam(S){
  const rows = DataSource.managers().map(m => {
    const mine = S.contacts.filter(c => c.manager_id === m.id).map(c => S.byId[c.id]).filter(Boolean);
    return {m, n: mine.length, avg: mine.length ? mine.reduce((a,s)=>a+s.total,0)/mine.length : null};
  }).filter(r => r.avg !== null).sort((a,b) => b.avg - a.avg);
  if(rows.length < 2) return '';
  const show = rows.length > 6 ? [...rows.slice(0,3), null, ...rows.slice(-2)] : rows;
  let html = '<div class="card"><div class="kpi-label">Команда · разрыв '+
    (rows[0].avg - rows[rows.length-1].avg).toFixed(1)+' балла</div><div style="margin-top:14px">';
  show.forEach(r => {
    if(!r){ html += '<div class="muted small" style="padding:6px 0">· · ·</div>'; return; }
    html += '<div class="skill"><div class="lbl"><span>'+esc(r.m.name)+'</span>'+
      '<span class="muted">'+r.avg.toFixed(1)+' · '+r.n+' конт.</span></div>'+
      '<div class="bar '+grade(r.avg,10)+'"><i style="width:'+Math.round(r.avg*10)+'%"></i></div></div>';
  });
  return html + '</div></div>';
}

/* Каналы: звонки против переписки */
function ovChannels(S){
  const calls = S.contacts.filter(c => c.kind === 'call').map(c => S.byId[c.id]).filter(Boolean);
  const chats = S.contacts.filter(c => c.kind === 'chat').map(c => S.byId[c.id]).filter(Boolean);
  if(!chats.length) return '';
  const a = calls.length ? calls.reduce((x,s)=>x+s.total,0)/calls.length : 0;
  const b = chats.reduce((x,s)=>x+s.total,0)/chats.length;
  return '<div class="card"><div class="kpi-label">Звонки и переписка</div>'+
    '<div style="display:flex;gap:26px;margin-top:16px">'+
      '<div style="flex:1"><div style="font-size:32px;font-weight:600">'+a.toFixed(1)+'</div>'+
        '<div class="muted small">'+calls.length+' звонков</div>'+
        '<div class="bar good" style="margin-top:10px"><i style="width:'+Math.round(a*10)+'%"></i></div></div>'+
      '<div style="flex:1"><div style="font-size:32px;font-weight:600;color:var(--'+grade(b,10)+')">'+b.toFixed(1)+'</div>'+
        '<div class="muted small">'+chats.length+' переписок</div>'+
        '<div class="bar '+grade(b,10)+'" style="margin-top:10px"><i style="width:'+Math.round(b*10)+'%"></i></div></div>'+
    '</div></div>';
}

function renderOverview(){
  const S = ovStats();
  const conv = (S.won + S.lost) ? Math.round(S.won/(S.won+S.lost)*100) : 0;

  let html = '<div class="grid">'+
    bigKpi('Коммуникаций', S.contacts.length,
      DataSource.calls().length+' звонков · '+DataSource.chats().length+' переписок')+
    bigKpi('Средний балл', S.avg !== null ? S.avg.toFixed(1) : '—',
      S.avg !== null ? 'из 10 · разобрано '+S.scored.length : 'аналитика не собрана',
      S.avg !== null ? grade(S.avg,10) : null)+
    bigKpi('Сделок в работе', S.leads.filter(l => !['closed_won','closed_lost'].includes(l.stage)).length,
      S.pipeline ? money(S.pipeline)+' в воронке' : '')+
    bigKpi('Конверсия', conv+'%', S.won+' выиграно / '+S.lost+' проиграно',
      conv >= 50 ? 'good' : conv >= 30 ? 'warn' : 'bad')+
  '</div>';

  if(S.scored.length){
    html += '<div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px">'+
      ovHistogram(S) + ovTeam(S) + ovChannels(S) + '</div>';
  }

  html += ovFunnel(S);
  html += bantDailyChart();

  const mx = CFG.matrix || {extract:[],evaluate:[]};
  if((mx.evaluate||[]).length){
    html += '<h2>Матрица · что система достаёт из каждого контакта</h2><div class="two">';
    html += '<div class="card"><div class="kpi-label">Слой 1 · извлекаем факты</div>';
    (mx.extract||[]).forEach(e => html += '<div class="crit"><span>'+esc(e.label)+'</span>'+
      '<span class="muted small" style="max-width:55%;text-align:right">'+esc(e.note||'')+'</span></div>');
    html += '</div><div class="card"><div class="kpi-label">Слой 2 · оцениваем работу</div>';
    (mx.evaluate||[]).forEach(e => html += '<div class="crit"><span>'+esc(e.name)+'</span>'+
      '<span class="muted small" style="max-width:55%;text-align:right">'+esc(e.includes||'')+'</span></div>');
    html += '</div></div>';
  } else {
    html += '<h2>Матрица оценки</h2>'+emptyBlock('Матрица ещё не настроена',
      'Кабинет не знает, что считать хорошим разговором в вашем бизнесе.','шага 0');
  }

  if((CFG.questions||[]).length){
    html += '<h2>Вопросы, на которые отвечает кабинет</h2><div class="card">';
    CFG.questions.forEach((q,i) => html += '<div class="crit"><span>'+(i+1)+'. '+esc(q)+'</span></div>');
    html += '</div>';
  }
  return html;
}
registerTab({ id: 'overview', label: 'Дашборд', render: renderOverview });

</script>
<script>
/* Блок «Коммуникации». Подключается сборщиком: scripts/build_cabinet.py */
/* ------------------------ КОММУНИКАЦИИ ------------------------ */
/* Два взгляда на одно и то же:
   «по датам»   — лента разговоров, так удобно разбирать качество;
   «по сделкам» — те же разговоры, склеенные по клиенту и этапу,
                  так видно, из чего сложился путь сделки.            */
function renderContacts(){
  const all = DataSource.contacts();
  const stages = [...new Set(all.map(c => c.stage))];
  let html = '<div class="row">'+
    '<select id="f-view"><option value="flat">По датам</option><option value="deal">По сделкам</option></select>'+
    '<select id="f-kind"><option value="">Звонки и переписка</option><option value="call">Только звонки</option><option value="chat">Только переписка</option></select>'+
    '<select id="f-stage"><option value="">Все этапы</option>'+
      stages.map(s => '<option value="'+esc(s)+'">'+esc(stageLabel(s))+'</option>').join('')+'</select>'+
    '<select id="f-mgr"><option value="">Все менеджеры</option>'+
      DataSource.managers().map(m => '<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('')+'</select>'+
    '<span class="muted" id="f-count"></span></div>'+
  '<div id="c-out"></div>';
  setTimeout(bindFilters, 0);
  return html;
}
function bindFilters(){
  const draw = () => {
    const fk = $('#f-kind').value, fs = $('#f-stage').value, fm = $('#f-mgr').value;
    const rows = DataSource.contacts().filter(c =>
      (!fk || c.kind === fk) && (!fs || c.stage === fs) && (!fm || c.manager_id === fm));
    $('#c-out').innerHTML = $('#f-view').value === 'deal' ? byDeal(rows) : byDate(rows);
    $('#f-count').textContent = rows.length+' из '+DataSource.contacts().length;
  };
  ['#f-view','#f-kind','#f-stage','#f-mgr'].forEach(s => $(s).onchange = draw);
  draw();
}
function byDate(rows){
  return '<table><thead><tr><th>Дата</th><th>Клиент</th><th>Канал</th><th>Менеджер</th>'+
    '<th>Этап</th><th>Объём</th><th>Балл</th><th>Итог</th></tr></thead><tbody>'+
    rows.map(c => {
      const s = scoreOf(c.id);
      const badge = s ? '<span class="pill '+grade(s.total,10)+'">'+s.total.toFixed(1)+'</span>' : '<span class="pill">—</span>';
      return '<tr class="clickable" onclick="openContact(\''+c.id+'\')">'+
        '<td>'+fmtDate(c.when)+'</td>'+
        '<td>'+esc(leadName(c.lead_id))+'</td>'+
        '<td><span class="pill">'+esc(c.kind==='call'?'звонок':(c.channel||'переписка'))+'</span></td>'+
        '<td>'+esc(mgrName(c.manager_id))+'</td>'+
        '<td><span class="pill">'+esc(stageLabel(c.stage))+'</span></td>'+
        '<td class="muted">'+esc(c.volume)+'</td><td>'+badge+'</td>'+
        '<td class="muted">'+esc(c.outcome||'')+'</td></tr>';
    }).join('')+'</tbody></table>';
}
function byDeal(rows){
  const ids = [...new Set(rows.map(c => c.lead_id))];
  ids.sort((a,b) => new Date(last(rows,b).when) - new Date(last(rows,a).when));
  return ids.map(id => {
    const own = rows.filter(c => c.lead_id === id), l = leadOf(id) || {};
    const sc = own.map(c => scoreOf(c.id)).filter(Boolean);
    const avg = sc.length ? sc.reduce((a,s) => a+s.total, 0)/sc.length : null;
    return '<details class="deal"><summary>'+
      '<span class="deal-name">'+esc(leadName(id))+'</span>'+
      dealStrip(id, rows)+
      '<span class="pill">'+esc(stageLabel(l.stage))+'</span>'+
      '<span class="muted small">'+own.length+' '+plural(own.length,'коммуникация','коммуникации','коммуникаций')+'</span>'+
      (avg!=null ? '<span class="pill '+grade(avg,10)+'">'+avg.toFixed(1)+'</span>' : '')+
      (l.value_kzt ? '<span class="muted small">'+money(l.value_kzt)+'</span>' : '')+
      '</summary><div class="deal-body">'+dealThread(id, rows)+'</div></details>';
  }).join('') || emptyBlock('Ничего не нашлось', 'Снимите один из фильтров.', 'сброса фильтров');
}
const last = (rows, id) => rows.filter(c => c.lead_id === id).slice(-1)[0];
function openContact(id){
  const c = DataSource.contacts().find(x => x.id === id);
  if(!c) return;
  const s = scoreOf(id);
  $('#m-title').textContent = leadName(c.lead_id)+' · '+stageLabel(c.stage);
  $('#m-sub').textContent = fmtDate(c.when)+' · '+(c.kind==='call'?'звонок':c.channel)+' · '+
    c.volume+' · '+mgrName(c.manager_id)+(c.outcome ? ' · '+c.outcome : '');

  let body = '';
  if(s){
    body += '<div class="card" style="margin-bottom:16px"><div class="kpi-label">Оценка по матрице</div>'+
      '<div class="kpi">'+s.total.toFixed(1)+' <span class="muted" style="font-size:16px">/ 10</span></div>';
    (s.evaluate || s.criteria || []).forEach(cr => {
      const v = cr.value, max = cr.max || 10;
      body += '<div class="skill"><div class="lbl"><span>'+esc(cr.name)+'</span>'+
        '<span class="muted">'+v+'/'+max+'</span></div>'+
        '<div class="bar '+grade(v,max)+'"><i style="width:'+Math.round(v/max*100)+'%"></i></div></div>';
    });
    if(s.comment) body += '<p class="muted small" style="margin:12px 0 0">'+esc(s.comment)+'</p>';
    body += '</div>';

    const ex = s.extracted;
    if(ex){
      body += '<div class="card" style="margin-bottom:16px"><div class="kpi-label">Извлечено из контакта</div>';
      if(ex.spsv) Object.entries(ex.spsv).forEach(([k,v]) =>
        body += '<div class="crit"><span class="muted">'+esc(k)+'</span><span style="max-width:65%;text-align:right">'+esc(v)+'</span></div>');
      if(ex.qualification) Object.entries(ex.qualification).forEach(([k,v]) =>
        body += '<div class="crit"><span class="muted">'+esc(k)+'</span><span>'+(v===true?'<span class="pill good">да</span>':v===false?'<span class="pill bad">нет</span>':esc(v))+'</span></div>');
      if((ex.objections||[]).length) body += '<div class="crit"><span class="muted">возражения</span>'+
        '<span style="max-width:65%;text-align:right">'+ex.objections.map(o=>'«'+esc(o)+'»').join('<br>')+'</span></div>';
      if(ex.next_step) body += '<div class="crit"><span class="muted">следующий шаг</span><span>'+esc(ex.next_step)+'</span></div>';
      if(ex.signals) body += '<div class="crit"><span class="muted">сигналы</span><span style="max-width:65%;text-align:right">'+esc(ex.signals)+'</span></div>';
      body += '</div>';
    }
  }
  const turns = c.kind === 'call' ? (c.transcript||[]) : (c.messages||[]);
  body += turns.map(t => '<div class="turn '+t.who+'"><div class="who">'+
    (t.who==='manager'?'менеджер':'клиент')+(t.ts?'<br><span style="opacity:.6">'+fmtDate(t.ts).slice(0,5)+'</span>':'')+
    '</div><div class="text">'+esc(t.text)+'</div></div>').join('');

  /* Разговор не висит в воздухе: показываем, во что он склеен */
  const rest = DataSource.contacts().filter(x => x.lead_id === c.lead_id);
  if(rest.length > 1) body += '<h2>Эта сделка целиком</h2>'+dealThread(c.lead_id);
  $('#m-body').innerHTML = body;
  $('#modal').showModal();
}
registerTab({ id: 'contacts', label: 'Коммуникации', render: renderContacts });

</script>
<script>
/* Блок «Инсайты». Подключается сборщиком: scripts/build_cabinet.py */
/* --------------------------- ИНСАЙТЫ --------------------------- */
function renderInsights(){
  const sc = DataSource.scores();
  if(!sc || !(sc.insights||[]).length){
    return emptyBlock('Инсайтов пока нет',
      'Когда коммуникации будут разобраны, кабинет сам найдёт закономерности: где проседает воронка, кто в чём силён, какие возражения повторяются.','шага 1');
  }
  const base = sc.insights.filter(i => i.scope === 'base');
  const rows = i => '<div class="insight '+esc(i.level||'')+'">'+
      '<h4>'+esc(i.title)+
      (i.scope === 'base' ? ' <span class="pill accent" style="font-size:11px;vertical-align:2px">по всей базе</span>' : '')+
      '</h4><p>'+esc(i.text)+'</p></div>';
  let html = sc.insights.filter(i => i.scope !== 'base').map(rows).join('');
  if(base.length){
    html += '<h2>Появилось после разбора всей базы</h2>' + base.map(rows).join('');
  }
  return html;
}
registerTab({ id: 'insights', label: 'Инсайты', render: renderInsights });

</script>
<script>
/* Блок «Менеджеры». Подключается сборщиком: scripts/build_cabinet.py */
/* -------------------------- МЕНЕДЖЕРЫ -------------------------- */
/* Карточка отвечает на вопрос руководителя: что с человеком и что ему уходит.
   Сам разбор и тексты для Telegram — в модалке: это письмо менеджеру,
   а не отчёт для чтения с экрана.                                          */
function renderManagers(){
  const coach = DataSource.coaching();
